name: One-time verified dataset import
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-dataset-once.yml]
permissions: {}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the exact public dataset; remove this workflow
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse,json,hashlib,time,concurrent.futures,pathlib
          revision="54a96a6fb6a2bd3b297e59869491db4d3625b711"
          url='https://huggingface.co/api/datasets/allenai/olmOCR-bench/tree/'+revision+'?recursive=true&limit=1000'
          entries=[]
          while url:
           with urllib.request.urlopen(url,timeout=60) as r:
            entries.extend(json.load(r)); link=r.headers.get('Link','')
           url=link.split('>')[0][1:] if 'rel="next"' in link else None
          files=[x for x in entries if x['type']=='file']
          assert len(files)==1418
          assert sum(x['size'] for x in files)==356940588
          def download(f):
           p=pathlib.Path(f['path']);p.parent.mkdir(parents=True,exist_ok=True)
           for attempt in range(4):
            try:
             if p.exists(): data=p.read_bytes()
             else:
              url='https://huggingface.co/datasets/allenai/olmOCR-bench/resolve/'+revision+'/'+urllib.parse.quote(f['path'])+'?download=true'
              with urllib.request.urlopen(url,timeout=90) as r: data=r.read()
             if len(data)!=f['size']: raise ValueError('size mismatch')
             if 'lfs' in f:
              assert hashlib.sha256(data).hexdigest()==f['lfs']['oid']
             else: assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==f['oid']
             p.write_bytes(data)
             return f['path']
            except Exception as e:
             if attempt==3: raise RuntimeError(f['path']+': '+str(e))
             time.sleep(attempt+1)
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
           for n,p in enumerate(pool.map(download,files),1):
            if n%100==0: print('Downloaded and verified',n,'/',len(files),flush=True)
          print('Complete:',len(files),'files',sum(f['size'] for f in files),'bytes',flush=True)
          
          # Store the actual PDF bytes in GitHub, rather than Hugging Face LFS pointers.
          p=pathlib.Path('.gitattributes')
          p.write_bytes(p.read_bytes()+b"\n# GitHub mirror: complete PDF files are stored directly in Git.\n*.pdf -filter -diff -merge\n**/*.pdf -filter -diff -merge\n")
          pathlib.Path('MIRROR_SOURCE.json').write_text(json.dumps({'source':'https://huggingface.co/datasets/allenai/olmOCR-bench','revision':revision,'file_count':len(files),'upstream_bytes':sum(x['size'] for x in files),'note':'All upstream files preserved except .gitattributes, which disables PDF LFS filters for this mirror.'},indent=2)+'\n')
          import subprocess
          paths=[x['path'] for x in files]+['MIRROR_SOURCE.json']
          workflow='.github/workflows/import-dataset-once.yml'
          pathlib.Path(workflow).unlink()
          subprocess.run(['git','add','--force','--',*paths],check=True)
          subprocess.run(['git','add','--',workflow],check=True)
          PY
      - name: Commit and upload dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import verified olmOCR-bench dataset and remove one-time importer"
          git push origin HEAD:main
